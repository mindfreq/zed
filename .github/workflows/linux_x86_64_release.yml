name: release-linux-x64

on:
  workflow_dispatch:

jobs:
  # Tests on Linux x64
  run_tests_linux:
    runs-on: ubuntu-22.04
    env:
      CC: clang
      CXX: clang++
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        clean: false

    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        profile: minimal

    - name: Cache Rust dependencies and build artifacts
      uses: Swatinem/rust-cache@v2
      with:
        prefix-key: "v1-rust"                    # غيّر إلى v2-rust إذا أردت مسح الكاش القديم
        shared-key: "zed-linux-x64"
        workspaces: "."
        cache-on-failure: true
        cache-bin: false
        restore-keys: |
          v1-rust-zed-linux-x64-
          v1-rust-

    - name: Setup Linux dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          clang \
          libxkbcommon-x11-dev \
          libwayland-dev \
          libx11-dev \
          libxcb-shape0-dev \
          libxcb-xfixes0-dev \
          libxkbcommon-dev \
          libssl-dev \
          libfontconfig-dev \
          libglib2.0-dev \
          libpango1.0-dev \
          libcairo2-dev \
          libatk-bridge2.0-dev \
          libgtk-3-dev

    - name: Run tests
      run: cargo test --workspace --no-fail-fast --locked

    timeout-minutes: 60

  # Clippy on Linux x64
  clippy_linux:
    if: github.repository_owner == 'zed-industries' || github.repository_owner == 'zed-extensions'
    runs-on: ubuntu-22.04
    env:
      CC: clang
      CXX: clang++
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        clean: false

    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        profile: minimal
        components: clippy

    - name: Cache Rust dependencies and build artifacts
      uses: Swatinem/rust-cache@v2
      with:
        prefix-key: "v1-rust"
        shared-key: "zed-linux-x64"
        workspaces: "."
        cache-on-failure: true
        cache-bin: false
        restore-keys: |
          v1-rust-zed-linux-x64-
          v1-rust-

    - name: Setup Linux dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          clang \
          libxkbcommon-x11-dev \
          libwayland-dev \
          libx11-dev \
          libxcb-shape0-dev \
          libxcb-xfixes0-dev \
          libxkbcommon-dev \
          libssl-dev

    - name: Run clippy
      run: cargo clippy --workspace --all-targets -- -D warnings

    timeout-minutes: 60

  # Bundle Linux x64 (Build + Upload Artifact)
  bundle_linux_x86_64:
    needs:
    - run_tests_linux
    - clippy_linux
    runs-on: ubuntu-22.04
    env:
      CARGO_INCREMENTAL: 0
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        clean: false

    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        profile: minimal
        target: x86_64-unknown-linux-gnu

    - name: Cache Rust dependencies and build artifacts
      uses: Swatinem/rust-cache@v2
      with:
        prefix-key: "v1-rust"
        shared-key: "zed-linux-x64"
        workspaces: "."
        cache-on-failure: true
        cache-bin: false
        restore-keys: |
          v1-rust-zed-linux-x64-
          v1-rust-

    - name: Setup Linux dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          clang-18 \
          libxkbcommon-x11-dev \
          libwayland-dev \
          libx11-dev \
          libxcb-shape0-dev \
          libxcb-xfixes0-dev \
          libxkbcommon-dev \
          libssl-dev \
          libfontconfig-dev \
          libglib2.0-dev \
          libpango1.0-dev \
          libcairo2-dev \
          libatk-bridge2.0-dev \
          libgtk-3-dev

    - name: Build release binary
      run: cargo build --release --bin zed --locked

    - name: Create tar.gz archive
      run: |
        cd target/release
        tar -czf zed-linux-x86_64.tar.gz zed

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: zed-linux-x86_64
        path: target/release/zed-linux-x86_64.tar.gz
        if-no-files-found: error

    timeout-minutes: 60

  # Create Draft Release + Upload Asset (الآن في job واحد)
  create_draft_release:
    needs: bundle_linux_x86_64
    runs-on: ubuntu-22.04
    steps:
    - name: Download built artifact
      uses: actions/download-artifact@v4
      with:
        name: zed-linux-x86_64
        path: ./artifacts/

    - name: Create draft release and upload asset
      uses: softprops/action-gh-release@v2
      with:
        draft: true
        generate_release_notes: true
        files: ./artifacts/zed-linux-x86_64.tar.gz
        name: Zed Linux x64 Draft
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true